<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main-content">Zum Inhalt springen</a>

  <div class="site">
    <header id="site-header">
      {{ partial "header.html" . }}
    </header>

    <main id="main-content">
      <div class="container">
        {{ block "main" . }}
          <article class="content">
              {{ if not .IsHome }}
                <header class="content-header"><h1>{{ .Title }}</h1></header>
              {{ end }}
              {{ block "content" . }}{{ end }}
          </article>
        {{ end }}
      </div>
    </main>

    <footer id="site-footer">
      {{ partial "footer.html" . }}
    </footer>
  </div>
</body>
</html>
