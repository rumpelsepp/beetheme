<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="container">
    <header id="site-header">
      {{ partial "header.html" . }}
    </header>

    <main>
      {{ block "main" . }}
        <article class="content">
            <header><h1>{{ .Title }}</h1></header>
            {{ block "content" . }}{{ end }}
        </article>
      {{ end }}
    </main>

    <footer id="site-footer">
      {{ partial "footer.html" . }}
    </footer>
  </div>
</body>
</html>
