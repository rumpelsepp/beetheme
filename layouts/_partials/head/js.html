{{- with resources.Match "*.js" }}
  {{- range . }}
    {{- if hugo.IsDevelopment }}
        <script type="module" src="{{ .RelPermalink }}" defer></script>
      {{- else }}
        <script type="module" src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{- end }}
  {{- end }}
{{- end }}
