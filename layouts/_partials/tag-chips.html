{{- /*
  Terms as a row of links, each with the number of its pages (.tag-chips
  in bundle_src/css/tags.css).

  Context: the pages of the terms, e.g. what .GetTerms "tags" returns.
*/ -}}
<ul class="tag-chips">
  {{- range . }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }} <span class="count">{{ len .Pages }}</span></a></li>
  {{- end }}
</ul>
